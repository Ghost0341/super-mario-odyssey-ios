name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Project with xcodebuild
        run: |
          # Finds the project/workspace automatically and builds it
          xcodebuild build \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          # Copies the generated .app bundle into Payload directory
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r AppRelease.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarioOdyssey-iOS-IPA
          path: AppRelease.ipa
