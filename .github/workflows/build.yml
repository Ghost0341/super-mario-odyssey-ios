name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Locate and Build Project
        run: |
          set -e
          echo "Searching for Xcode projects or workspaces..."
          
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 3 | head -n 1)
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            echo "Found workspace: $WORKSPACE"
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -m 1 -E '^\s+' | tr -d '[:space:]')
            echo "Building scheme: $SCHEME"
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
          elif [ -n "$PROJECT" ]; then
            echo "Found project: $PROJECT"
            SCHEME=$(xcodebuild -project "$PROJECT" -list | grep -m 1 -E '^\s+' | tr -d '[:space:]')
            echo "Building scheme: $SCHEME"
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
          else
            echo "Error: No Xcode project or workspace found in the repository."
            ls -la
            exit 1
          fi

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r AppRelease.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarioOdyssey-iOS-IPA
          path: AppRelease.ipa
