name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List All Repository Files & Scripts
        run: |
          echo "=== ROOT DIRECTORY ==="
          ls -la
          
          echo "=== SCRIPTS FOLDER ==="
          if [ -d "scripts" ]; then ls -la scripts; else echo "No scripts folder"; fi
          
          echo "=== TOOLS FOLDER ==="
          if [ -d "tools" ]; then ls -la tools; else echo "No tools folder"; fi
          
          echo "=== DM FOLDER ==="
          if [ -d "dm" ]; then ls -la dm; else echo "No dm folder"; fi

          echo "=== SEARCHING FOR BUILD / MAKE / CMAKE FILES ==="
          find . -name "Makefile" -o -name "CMakeLists.txt" -o -name "*.sh" -o -name "*.py"
